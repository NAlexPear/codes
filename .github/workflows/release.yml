name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v5
        with:
          cache: pnpm
          node-version: 24
      - name: Verify release version
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$RELEASE_TAG" != "v$package_version" ]]; then
            echo "Release tag $RELEASE_TAG does not match package version $package_version." >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: macos-15
            target: darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v5
        with:
          cache: pnpm
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify standalone executable
        env:
          TYPESAFE_API_KEY: ''
        shell: bash
        run: |
          "$GITHUB_WORKSPACE/dist/codes" --help | grep -q '^Usage: codes'
          test_dir="$(mktemp -d)"
          if printf '%s\n' 'Open carpal tunnel release.' | (cd "$test_dir" && "$GITHUB_WORKSPACE/dist/codes") 2>error.txt; then
            echo 'Expected the CLI to require an API key.' >&2
            exit 1
          fi
          grep -q 'TYPESAFE_API_KEY is required' error.txt
      - name: Package executable
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          mkdir release
          tar -czf "release/codes-${RELEASE_TAG}-${TARGET}.tar.gz" -C dist codes
      - uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: ${{ matrix.target }}
          path: release/*

  release:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release
      - name: Create checksums
        run: cd release && sha256sum codes-* > SHA256SUMS
      - name: Generate release notes
        shell: bash
        run: |
          previous_tag="$(git describe --tags --abbrev=0 "${RELEASE_TAG}^" 2>/dev/null || true)"
          range="$RELEASE_TAG"
          if [[ -n "$previous_tag" ]]; then
            range="$previous_tag..$RELEASE_TAG"
          fi
          {
            printf '## Changes\n\n'
            git log --reverse --pretty='- %s' --invert-grep --grep='^🔖 Release ' "$range"
            if [[ -n "$previous_tag" ]]; then
              printf '\n**Full Changelog**: %s/%s/compare/%s...%s\n' \
                "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$previous_tag" "$RELEASE_TAG"
            fi
          } > release-notes.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$RELEASE_TAG" release/* --notes-file
          release-notes.md --repo "$GITHUB_REPOSITORY" --title "$RELEASE_TAG"
          --verify-tag
